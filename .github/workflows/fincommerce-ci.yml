name: FinCommerce CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Access practice secret
        env:
          PRACTICE_SECRET: ${{ secrets.PRACTICE_SECRET }}
        run: |
          if [ -n "$PRACTICE_SECRET" ]; then
            echo "Practice secret is available."
          else
            echo "Practice secret is missing."
            exit 1
          fi
        
      - name: Read application variable
        env:
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          echo "Application name: $APP_NAME"

      - name: Build Spring Boot backend
        working-directory: backend/FinCommerceBackend
        run: mvn -B clean verify

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend/frontend
        run: npm run build
